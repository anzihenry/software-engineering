name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint validator
        run: ruff check scripts tests skills/05-integration-validation/github-actions-bootstrap/scripts

      - name: Check validator formatting
        run: ruff format --check scripts tests skills/05-integration-validation/github-actions-bootstrap/scripts

      - name: Run validator tests
        run: python -m unittest discover --start-directory tests

      - name: Validate repository
        run: python scripts/check_repository.py
