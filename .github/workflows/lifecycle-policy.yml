name: Lifecycle policy

"on":
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions: {}

concurrency:
  group: lifecycle-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lifecycle-policy:
    name: lifecycle-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Read pull request files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh api --paginate --slurp
          "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100"
          > "$RUNNER_TEMP/pull-request-files.json"

      - name: Validate lifecycle PR record
        run: >-
          python -m scripts.github_lifecycle validate-pr
          --event "$GITHUB_EVENT_PATH"
          --policy .github/lifecycle-policy.json
          --files "$RUNNER_TEMP/pull-request-files.json"
